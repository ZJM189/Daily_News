[project]
name = "daily-news-api"
version = "0.1.0"
description = "Daily News backend API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.0",
  "anyio>=4.0.0,<5.0.0",
  "apscheduler>=3.10.4",
  "argon2-cffi>=23.1.0",
  "cryptography>=42.0.0",
  "deepagents==0.7.13",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0,<0.116.0",
  "httpx>=0.28.1,<0.29.0",
  "langchain-openai==1.0.3",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.4.0",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.0",
  "starlette>=0.40.0,<0.42.0",
  "typer>=0.12.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]

[project.scripts]
daily-news = "app.interfaces.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
